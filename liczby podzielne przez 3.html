
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Liczby podzielne przez 3</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial;
            text-align: center;
            background: linear-gradient(lightgreen, lightblue);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        h1 {
            color: rgb(0, 0, 0);
            padding-top: 30px;
        }

        h2 {
            color: rgb(0, 0, 0);
            margin-top: 30px;
        }

        .wynik {
            background-color: rgba(255, 255, 255, 0.8);
            width: 70%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Liczby podzielne przez 3</h1>

    <div class="wynik">
        <script>

            let tablica = [];
            let podzielne = [];
            let suma = 0;

            // Losowanie 20 liczb od 1 do 50
            for (let i = 0; i < 20; i++) {
                tablica[i] = Math.floor(Math.random() * 50) + 1;
            }

            // Wyszukiwanie liczb podzielnych przez 3
            for (let i = 0; i < 20; i++) {
                if (tablica[i] % 3 == 0) {
                    podzielne.push(tablica[i]);
                    suma = suma + tablica[i];
                }
            }

            // Obliczanie średniej
            let srednia = 0;

            if (podzielne.length > 0) {
                srednia = suma / podzielne.length;
            }

            document.write("<h2>Wylosowane liczby:</h2>");
            document.write(tablica.join(", "));

            document.write("<h2>Liczby podzielne przez 3:</h2>");
            document.write(podzielne.join(", "));

            if (podzielne.length > 0) {
                document.write("<h2>Średnia arytmetyczna:</h2>");
                document.write(srednia.toFixed(2));
            } else {
                document.write("<h2>Brak liczb podzielnych przez 3.</h2>");
            }

        </script>
    </div>

</body>
</html>
